services:
  backend:
    build: ./backend
    container_name: dvtc-backend
    environment:
      - FRONTEND_URL=http://localhost:3001
      - SECRET_KEY=super-secret-key-for-ctf
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Traefik path-based routing for production (Dokploy)
      # Routes yourdomain.com/api/* to this backend
      - "traefik.enable=true"
      - "traefik.http.routers.dvtc-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.dvtc-api.entrypoints=websecure"
      - "traefik.http.routers.dvtc-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.dvtc-api.loadbalancer.server.port=8000"

  frontend:
    build: ./frontend
    container_name: dvtc-frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=DVTC Trust Center
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
